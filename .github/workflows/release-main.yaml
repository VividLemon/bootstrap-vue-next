# This workflow is for the release please action. It automates releases when using conventional commit messages
# It also auto publishes releases to npm under the @latest tag on merge
# For more information see: https://github.com/google-github-actions/release-please-action

name: release-main

on:
  push:
    branches:
      - main

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    runs-on: ubuntu-latest

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      bootstrap_vue_next_release_created: ${{ steps.release.outputs['packages/bootstrap-vue-next--release_created'] }}
      mcp_release_created: ${{ steps.release.outputs['packages/mcp--release_created'] }}

    steps:
      - name: Use Release Please
        uses: googleapis/release-please-action@v5
        id: release

      # The logic below handles the npm publication:

      - name: Clone Repository
        uses: actions/checkout@v7
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      - name: Set up Vite+ (Node 24, Bun from packageManager)
        # Pin an exact release: the floating v1 tag is frozen at v1.15.0
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true # caches Bun's package data (detects bun.lock)
          run-install: false
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      - name: Install Dependencies
        run: vp install --frozen-lockfile --ignore-scripts
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      - name: Build Library
        run: vp run --filter bootstrap-vue-next --filter @bootstrap-vue-next/nuxt --filter @bootstrap-vue-next/mcp build
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      # bun publish supports neither npm trusted publishing (OIDC) nor provenance, so Bun only packs
      # (`bun pm pack` rewrites workspace: dependencies) and npm publishes the tarball, which keeps
      # trusted publishing through id-token: write and automatic provenance. Needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      - name: Publish Main
        working-directory: packages/bootstrap-vue-next
        run: |
          bun pm pack --destination "$RUNNER_TEMP/pack-main" --ignore-scripts
          npm publish "$RUNNER_TEMP"/pack-main/*.tgz --tag latest --access public
        if: ${{ steps.release.outputs.releases_created == 'true' && steps.release.outputs['packages/bootstrap-vue-next--release_created'] == 'true' }}

      - name: Publish Nuxt
        working-directory: packages/nuxt
        run: |
          bun pm pack --destination "$RUNNER_TEMP/pack-nuxt" --ignore-scripts
          npm publish "$RUNNER_TEMP"/pack-nuxt/*.tgz --tag latest --access public
        if: ${{ steps.release.outputs.releases_created == 'true' && steps.release.outputs['packages/nuxt--release_created'] == 'true' }}

      - name: Publish MCP
        working-directory: packages/mcp
        run: |
          bun pm pack --destination "$RUNNER_TEMP/pack-mcp" --ignore-scripts
          npm publish "$RUNNER_TEMP"/pack-mcp/*.tgz --tag latest --access public
        if: ${{ steps.release.outputs.releases_created == 'true' && steps.release.outputs['packages/mcp--release_created'] == 'true' }}

  # Building and deploying the docs are separate jobs on purpose: when
  # upload-pages-artifact and deploy-pages run in the same job, deploy-pages can
  # list the run's artifacts before the just-finalized upload is visible and fail
  # with 'No artifacts named "github-pages"' (actions/deploy-pages#451).
  build-docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.bootstrap_vue_next_release_created == 'true' }}
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site config

    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+ (Node 24, Bun from packageManager)
        # Pin an exact release: the floating v1 tag is frozen at v1.15.0
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true # caches Bun's package data (detects bun.lock)
          run-install: false

      - name: Install Dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Build Documentation
        # `docs...` also builds the workspace packages the docs depend on (bootstrap-vue-next), first
        run: vp run --filter 'docs...' build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/docs/.vitepress/dist

  deploy-docs:
    needs: build-docs
    permissions:
      pages: write
      id-token: write

    concurrency: ci-${{ github.ref }}

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

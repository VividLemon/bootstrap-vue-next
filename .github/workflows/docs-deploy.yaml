# This workflow builds and deploys the docs to GitHub Pages

name: docs-github-pages-deploy

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  # Build and deploy are separate jobs on purpose: when upload-pages-artifact and
  # deploy-pages run in the same job, deploy-pages can list the run's artifacts
  # before the just-finalized upload is visible and fail with
  # 'No artifacts named "github-pages"' (actions/deploy-pages#451).
  build:
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site config

    runs-on: ubuntu-latest

    steps:
      - name: Early Exit If Not BVN release
        if: startsWith(github.event.release.tag_name, 'bootstrapvuenext') == false
        run: exit 0

      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+ (Node 24, Bun from packageManager)
        # Pin an exact release: the floating v1 tag is frozen at v1.15.0
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true # caches Bun's package data (detects bun.lock)
          run-install: false

      - name: Install Dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Build Library
        # `docs...` also builds the workspace packages the docs depend on (bootstrap-vue-next), first
        run: vp run --filter 'docs...' build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/docs/.vitepress/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

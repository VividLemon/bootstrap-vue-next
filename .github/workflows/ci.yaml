# This workflow runs through the test suite

name: ci

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Set up Vite+ (Node 24, Bun from packageManager)
        # Pin an exact release: the floating v1 tag is frozen at v1.15.0
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true # caches Bun's package data (detects bun.lock)
          run-install: false

      - name: Install Dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Build Library
        run: vp run build

      - name: Upload build artifacts for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          include-hidden-files: true
          path: |
            packages/bootstrap-vue-next/dist
            packages/nuxt/dist
            packages/nuxt/.nuxt
            packages/nuxt/playground/.nuxt
          retention-days: 1

      - name: Validate Docs Page Structure
        run: vp run --filter docs test:unit:ci

      - name: Run publint
        run: vp run --filter bootstrap-vue-next publint

      - name: Run publint on Nuxt package
        run: vp run --filter @bootstrap-vue-next/nuxt publint

      - name: Publish preview packages
        # --bun packs with `bun pm pack`, which rewrites workspace: dependencies
        run: bun x pkg-pr-new publish './packages/bootstrap-vue-next' './packages/nuxt' --template './templates/vite' --bun

  test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Set up Vite+ (Node 24, Bun from packageManager)
        # Pin an exact release: the floating v1 tag is frozen at v1.15.0
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true # caches Bun's package data (detects bun.lock)
          run-install: false

      - name: Install Dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Test Lint
        run: vp run test:lint:ci

  test-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Set up Vite+ (Node 24, Bun from packageManager)
        # Pin an exact release: the floating v1 tag is frozen at v1.15.0
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true # caches Bun's package data (detects bun.lock)
          run-install: false

      - name: Install Dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Test Unit
        run: vp run test:unit:ci

  test-nuxt-e2e:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Set up Vite+ (Node 24, Bun from packageManager)
        # Pin an exact release: the floating v1 tag is frozen at v1.15.0
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true # caches Bun's package data (detects bun.lock)
          run-install: false

      - name: Install Dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Install Playwright browser for Nuxt tests
        # Use the package's own playwright-core so the browser build always matches it
        working-directory: packages/nuxt
        run: bun x playwright-core install --with-deps chromium

      - name: Run Nuxt Playwright tests
        run: vp run --filter @bootstrap-vue-next/nuxt test:e2e
